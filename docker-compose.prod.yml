services:
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: glamping_backend_prod
    ports:
      - "3000:3000"
    env_file:
      - ./BackEnd/.env
    environment:
      - NODE_ENV=development
      - PORT=3000
    restart: always

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
      target: production
    container_name: glamping_frontend_prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
